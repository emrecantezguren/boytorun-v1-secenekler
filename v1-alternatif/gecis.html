<main class="gecis" aria-labelledby="gecis-bas">
 <div class="gecis-ic">
  <img class="gecis-logo" src="../gorseller/logo-boytorun.png" alt="Boytorun Architects" width="2172" height="669">
  <h1 class="gecis-bas" id="gecis-bas">Taking you to <b>boytorunarch.com</b></h1>
  <p class="gecis-alt">Our main website, where we receive project enquiries.</p>
  <span class="gecis-cizgi" aria-hidden="true"><i></i></span>
  <div class="gecis-dugmeler"><a class="gecis-dugme" href="../kurumsal-1/teklif.html" data-hedef>Continue now</a><button type="button" class="gecis-dugme" data-iptal>Cancel</button></div>
 </div>
</main>
<script>
(() => {
  const az = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hedef = document.querySelector('[data-hedef]').href;
  const zam = setTimeout(() => location.replace(hedef), az ? 700 : 1800);
  // Cancel: yeni sekmeyi kapat; tarayıcı izin vermezse vitrin ana sayfasına dön
  const iptal = () => { clearTimeout(zam); window.close(); setTimeout(() => { location.href = 'index.html'; }, 200); };
  document.querySelector('[data-iptal]').addEventListener('click', iptal);
  addEventListener('keydown', (ev) => { if (ev.key === 'Escape') iptal(); });
})();
</script>
</body>
